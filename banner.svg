<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- soft cloud shapes -->
  <g opacity="0.10" fill="#ffffff">
    <ellipse cx="150" cy="250" rx="120" ry="30"/>
    <ellipse cx="230" cy="235" rx="90" ry="26"/>
    <ellipse cx="1000" cy="70" rx="140" ry="34"/>
    <ellipse cx="1080" cy="55" rx="90" ry="24"/>
  </g>

  <!-- sun / weather glyph -->
  <g transform="translate(150,150)">
    <circle r="46" fill="#38bdf8" opacity="0.9"/>
    <circle r="46" fill="none" stroke="#f0f4ff" stroke-width="2" opacity="0.5"/>
    <g stroke="#f0f4ff" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="0" y1="-68" x2="0" y2="-56"/>
      <line x1="0" y1="56" x2="0" y2="68"/>
      <line x1="-68" y1="0" x2="-56" y2="0"/>
      <line x1="56" y1="0" x2="68" y2="0"/>
      <line x1="-48" y1="-48" x2="-40" y2="-40"/>
      <line x1="40" y1="40" x2="48" y2="48"/>
      <line x1="48" y1="-48" x2="40" y2="-40"/>
      <line x1="-40" y1="40" x2="-48" y2="48"/>
    </g>
  </g>

  <text x="280" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="url(#textGrad)" letter-spacing="-2">SkyPulse</text>
  <text x="282" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#aab4d4" letter-spacing="0.5">Real-time weather at your fingertips</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f2027">
    <rect x="282" y="230" width="90" height="34" rx="17" fill="#61dafb"/>
    <text x="300" y="252">React</text>

    <rect x="384" y="230" width="80" height="34" rx="17" fill="#a78bfa"/>
    <text x="400" y="252">Vite</text>

    <rect x="476" y="230" width="90" height="34" rx="17" fill="#38bdf8"/>
    <text x="493" y="252">MUI</text>
  </g>
</svg>
